[package]
name = "reclip-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "reclip_core"
path = "src/lib.rs"

[[bin]]
name = "reclip-core"
path = "src/main.rs"

[[bin]]
name = "fake-ytdlp"
path = "src/bin/fake-ytdlp.rs"

[dependencies]
reclip-shared = { path = "../shared" }
serde.workspace = true
serde_json.workspace = true
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
tempfile = "3"
which = "8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["process", "time", "rt", "macros", "io-util"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time"] }
